# ===== Base de datos =====
# En producción conviene no dejar la contraseña acá: se puede pasar como
# variable de entorno SPRING_DATASOURCE_PASSWORD (ver README).
spring.datasource.url=jdbc:mysql://localhost:3306/muebleria?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=muebleria
spring.datasource.password=cambiar-esta-clave

# Las tablas se crean con el archivo muebleria.sql, Hibernate no las toca.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Fotos =====
# Carpeta donde se guardan las fotos de los productos.
# En Tomcat poné una ruta absoluta, por ejemplo /var/muebleria/uploads o C:/muebleria/uploads
app.carpeta-uploads=uploads
# Tamaño máximo de foto que se puede subir (el panel igual la achica antes de mandarla)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===== Dueño =====
# Solo se usa la primera vez que arranca, si la tabla usuarios está vacía.
# Después cambiá la contraseña desde el panel.
app.dueno.usuario=dueno
app.dueno.clave-inicial=cambiar-esta-clave

# Para que los mensajes de error lleguen al front (ej: "Falta el nombre.")
server.error.include-message=always
